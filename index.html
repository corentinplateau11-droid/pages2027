<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Un cadeau t’attend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff1ea;--bg2:#ffd9d2;--ink:#3a1747;--soft:#6e4a7a;--card:#ffffff;--gold:#c8841a;--rose:#d9455f;--ribbon:#d9455f;--box:#7b3fa0;--lid:#9a5cc4;--line:#e9c9d6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#160c2b;--bg2:#2b1448;--ink:#fff4e6;--soft:#c9b3dc;--card:#2a1a45;--gold:#f2c46d;--rose:#ff7d93;--ribbon:#f2c46d;--box:#5b2f8c;--lid:#7a49b0;--line:#4a3270}}
:root[data-theme="dark"]{--bg:#160c2b;--bg2:#2b1448;--ink:#fff4e6;--soft:#c9b3dc;--card:#2a1a45;--gold:#f2c46d;--rose:#ff7d93;--ribbon:#f2c46d;--box:#5b2f8c;--lid:#7a49b0;--line:#4a3270}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:radial-gradient(120% 90% at 50% 0%,var(--bg2),var(--bg) 70%);color:var(--ink);font-family:"Fraunces",Georgia,serif;display:flex;justify-content:center}
main{width:100%;max-width:440px;padding:28px 22px 40px;text-align:center}
.screen{display:none;min-height:calc(100vh - 80px);flex-direction:column;justify-content:center;gap:18px}
.screen.on{display:flex}
h1{font-size:2.1rem;line-height:1.15;margin:0}
p{margin:0;line-height:1.55;color:var(--soft);font-size:1.05rem}
.hand{font-family:"Caveat","Segoe Script",cursive;font-size:1.6rem;color:var(--rose);line-height:1.25}
.dots{display:flex;justify-content:center;gap:14px;margin:6px 0}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--gold);transition:background .15s}
.dots i.f{background:var(--gold)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:0 auto;width:100%}
.pad button{font:inherit;font-size:1.4rem;padding:14px 0;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.pad button:active{transform:scale(.95)}
.pad button:focus-visible,.cta:focus-visible,.gift:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.err{min-height:1.4em;color:var(--rose);font-size:.98rem}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.cta{font:inherit;font-size:1.1rem;padding:14px 28px;border-radius:999px;border:0;background:var(--rose);color:#fff;cursor:pointer;align-self:center}
.cta:active{transform:scale(.97)}
.gifts{display:flex;flex-direction:column;gap:26px;align-items:center;margin:8px 0}
.gift{background:none;border:0;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px}
.box{position:relative;width:110px;height:92px;margin-top:30px}
.base{position:absolute;bottom:0;left:0;right:0;height:68px;background:var(--box);border-radius:6px}
.base:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:16px;margin-left:-8px;background:var(--ribbon)}
.lid{position:absolute;top:0;left:-6px;right:-6px;height:30px;background:var(--lid);border-radius:6px;transform-origin:left bottom;transition:transform .7s cubic-bezier(.3,1.4,.5,1)}
.lid:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:16px;margin-left:-8px;background:var(--ribbon)}
.lid:after{content:"❤";position:absolute;left:50%;top:-18px;transform:translateX(-50%);font-size:22px;color:var(--ribbon)}
.gift.open .lid{transform:translate(-14px,-34px) rotate(-28deg)}
.gift:not(.open) .box{animation:bob 2.6s ease-in-out infinite}
.gift:nth-child(2) .box{animation-delay:.4s}.gift:nth-child(3) .box{animation-delay:.8s}
@keyframes bob{50%{transform:translateY(-6px)}}
.tag{font-family:"Caveat","Segoe Script",cursive;font-size:1.45rem;color:var(--ink);background:var(--card);border:1px dashed var(--gold);padding:2px 16px;border-radius:8px}
.modal{position:fixed;inset:0;background:rgba(10,4,24,.72);display:none;align-items:center;justify-content:center;padding:22px;z-index:20}
.modal.on{display:flex}
.card{background:var(--card);border-radius:20px;max-width:380px;width:100%;overflow:hidden;animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.6) rotate(-4deg);opacity:0}}
.photo{height:230px;background:linear-gradient(135deg,var(--box),var(--rose));display:flex;align-items:center;justify-content:center;font-size:5rem}
.photo img{width:100%;height:100%;object-fit:cover}
.card .in{padding:18px 20px 22px;display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;font-size:1.5rem}
.photo svg{width:100%;height:100%;display:block}
.pol{display:block;margin:0 auto;border:6px solid #fff;border-bottom-width:18px;box-shadow:0 6px 18px rgba(0,0,0,.3);border-radius:3px;transform:rotate(-3deg);background:#fff}.pol.s{width:104px}.pol.m{width:190px;transform:rotate(2deg)}
.conf{position:fixed;top:0;font-size:22px;pointer-events:none;z-index:30;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
 <section id="s1" class="screen on">
  <img class="pol s" id="p1" alt="Nous deux">
  <div class="hand">psst… quelqu’un t’a préparé quelque chose</div>
  <h1>Un cadeau t’attend</h1>
  <p>Entre le code à 4 chiffres pour ouvrir ton cadeau.</p>
  <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
  <div class="err" id="err" role="alert"></div>
  <div class="pad" id="pad"></div>
 </section>
 <section id="s2" class="screen">
  <img class="pol m" id="p2" alt="Nous deux">
  <div class="hand" id="hello"></div>
  <h1 id="hi"></h1>
  <p id="msg"></p>
  <button class="cta" id="go">Continuer</button>
 </section>
 <section id="s3" class="screen">
  <h1>Choisis un coffret</h1>
  <p>Chacun cache quelque chose pour toi.</p>
  <div class="gifts" id="gifts"></div>
  <div class="hand" id="final" hidden></div>
 </section>
</main>
<div class="modal" id="modal"><div class="card"><div class="photo" id="ph"></div><div class="in"><h2 id="mt"></h2><p id="mn"></p><button class="cta" id="close">Fermer</button></div></div></div>

 }
}
document.addEventListener("keydown",function(e){if(!$("s1").classList.contains("on"))return;if(/^\d$/.test(e.key))press(e.key);if(e.key==="Backspace")press("⌫")});
$("go").onclick=function(){show("s3")};
var opened=0,g=$("gifts");
CFG.gifts.forEach(function(x){
 var b=document.createElement("button");b.type="button";b.className="gift";
 b.innerHTML='<div class="box"><div class="base"></div><div class="lid"></div></div><div class="tag"></div>';
 b.querySelector(".tag").textContent=x.tag;
 b.onclick=function(){
  if(!b.classList.contains("open")){b.classList.add("open");opened++}
  confetti(18);
  setTimeout(function(){
   $("ph").innerHTML="";
   if(x.img){var im=new Image();im.alt=x.title;im.src=x.img;$("ph").appendChild(im)}else if(x.art){$("ph").innerHTML=x.art}else{$("ph").textContent=x.emoji}
   $("mt").textContent=x.title;$("mn").textContent=x.note;$("modal").classList.add("on");$("close").focus();
  },650);
 };
 g.appendChild(b);
});
$("close").onclick=function(){$("modal").classList.remove("on");if(opened===CFG.gifts.length){var f=$("final");f.textContent=CFG.final;f.hidden=false;confetti(30)}};
function confetti(n){
 var set=["❤","✨","🎉","💛","🎊"];
 for(var i=0;i<n;i++){var s=document.createElement("span");s.className="conf";s.textContent=set[i%set.length];s.style.left=Math.random()*100+"vw";s.style.animationDelay=Math.random()*.5+"s";document.body.appendChild(s);setTimeout(function(el){el.remove()},2400,s)}
}
</script>
</body>
